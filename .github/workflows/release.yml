name: Release

# The pinned release workflow (I7, repaired by R6). Three rules this file
# exists to keep:
#
# 1. PRODUCTION IS EXPLICIT. The only trigger is workflow_dispatch with a
#    chosen target; checks (checks.yml) and a staging deploy can never
#    promote anything by themselves. The production job runs under the
#    alpha-production environment NAME; whether GitHub protection
#    (required reviewers) is configured on that environment is live
#    repository state this YAML cannot prove; provisioning and the first
#    protected execution belong to the owner and I8.
# 2. SECRETS ARE ENVIRONMENT-SCOPED. The staging job may reference only
#    STAGING_* secrets and the production job only PRODUCTION_*; the
#    verify-target guard re-checks THIS file at deploy time and the
#    runtime environment label, so a smuggled cross-environment secret
#    fails the job before anything is touched. The Checks gate token is
#    the workflow's own github.token (a context reference, not a secret).
# 3. NOTHING DEPLOYS WITHOUT THE REHEARSAL AND THE EXACT-SHA CHECKS. The
#    deterministic release rehearsal (expand / interrupt / resume /
#    mixed versions / contract) must pass first, and the named
#    deterministic Checks job must have completed SUCCESS for the exact
#    GITHUB_SHA before any transport runs.
#
# Provisioning honesty (R6): the staging and alpha production clouds are
# PENDING owner actions (infra/environments/*.md). Until the named
# configuration exists, deploy-component.mjs records a BLOCKED outcome per
# component (names only) and the job FAILS while still uploading the
# evidence ledger: a green job always means deployed bytes, never a
# placeholder.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Release target (production runs in the alpha-production environment; protection is owner-provisioned)"
        type: choice
        options: [staging, production]
        required: true
      notes:
        description: "Why this release is being cut (recorded verbatim in the release-attempt evidence record)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

# One release per target at a time: a concurrent attempt QUEUES (never
# cancels a running release), and a queued production run still stops at
# the alpha-production environment before doing anything.
concurrency:
  group: release-${{ github.event.inputs.target }}
  cancel-in-progress: false

jobs:
  rehearse:
    name: Deterministic release rehearsal (expand, interrupt, resume, contract)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KIERO_REHEARSAL_LEDGER: rehearsal-ledger.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - name: Clean install from the lockfile
        run: npm ci
      - name: Run the release rehearsal
        run: node --experimental-strip-types tools/migrations/rehearsal.mts
      - name: Unit checks of the release surfaces (migration, update flow, guards)
        run: npx vitest run tests/i7
      - name: Keep the rehearsal ledger and summary for the evidence records
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-evidence
          path: |
            rehearsal-ledger.jsonl
            rehearsal-summary.json
          if-no-files-found: error

  staging-deploy:
    name: Deploy synthetic staging (isolated environment)
    needs: rehearse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      checks: read
    env:
      KIERO_ENVIRONMENT: staging
      # Name-only mappings (values live server-side; the guard checks the
      # NAMES this job references against the descriptor's prefix).
      RELEASE_NOTES: ${{ github.event.inputs.notes }}
      VITE_CONVEX_URL: ${{ vars.STAGING_CONVEX_URL }}
      CONVEX_DEPLOYMENT: ${{ secrets.STAGING_CONVEX_DEPLOYMENT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - name: Verify the release target (structure + label + descriptor; names only, never values)
        run: >
          node infra/release/verify-target.mjs --target staging
          --workflow .github/workflows/release.yml
          --descriptor infra/release/targets/staging.json
          --checks-workflow .github/workflows/checks.yml
      - name: Clean install from the lockfile
        run: npm ci
      - name: Download the rehearsal evidence
        uses: actions/download-artifact@v4
        with:
          name: rehearsal-evidence
      - name: Require the deterministic Checks success for this exact SHA
        env:
          CHECKS_GITHUB_TOKEN: ${{ github.token }}
        run: >
          node infra/release/verify-checks.mjs
          --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA"
          --descriptor infra/release/targets/staging.json
          --token-env CHECKS_GITHUB_TOKEN --out checks-report.json
      - name: Deploy every descriptor component through the checked adapter
        if: ${{ always() }}
        run: >
          node infra/release/deploy-component.mjs
          --descriptor infra/release/targets/staging.json
          --revision "$GITHUB_SHA" --checks-report checks-report.json
          --ledger infra/release/evidence/releases.jsonl
          --outcomes deploy-outcomes.json
      - name: Record the release attempt (append-only, digests only)
        if: ${{ always() }}
        run: >
          node infra/release/record-release-evidence.mjs
          --target staging --descriptor infra/release/targets/staging.json
          --revision "$GITHUB_SHA" --notes "$RELEASE_NOTES"
          --rehearsal-passed "$(jq -r .passed rehearsal-summary.json)"
          --rehearsal-rows "$(jq -r .rows rehearsal-summary.json)"
          --runtime-version a3.0 --client-version i7.1
          --migration-ledger rehearsal-ledger.jsonl
      - name: Upload the evidence ledger and outcomes (blocked runs fail while uploading evidence)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-staging
          path: |
            infra/release/evidence/releases.jsonl
            deploy-outcomes.json
            checks-report.json
          if-no-files-found: error

  production-deploy:
    name: Deploy alpha production (explicit trigger + alpha-production environment)
    needs: [rehearse, staging-deploy]
    if: ${{ github.event.inputs.target == 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: alpha-production
    permissions:
      contents: read
      checks: read
    env:
      KIERO_ENVIRONMENT: production
      RELEASE_NOTES: ${{ github.event.inputs.notes }}
      VITE_CONVEX_URL: ${{ vars.PRODUCTION_CONVEX_URL }}
      CONVEX_DEPLOYMENT: ${{ secrets.PRODUCTION_CONVEX_DEPLOYMENT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - name: Verify the release target (structure + label + descriptor; names only, never values)
        run: >
          node infra/release/verify-target.mjs --target production
          --workflow .github/workflows/release.yml
          --descriptor infra/release/targets/production.json
          --checks-workflow .github/workflows/checks.yml
      - name: Clean install from the lockfile
        run: npm ci
      - name: Download the rehearsal evidence
        uses: actions/download-artifact@v4
        with:
          name: rehearsal-evidence
      - name: Require the deterministic Checks success for this exact SHA
        env:
          CHECKS_GITHUB_TOKEN: ${{ github.token }}
        run: >
          node infra/release/verify-checks.mjs
          --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA"
          --descriptor infra/release/targets/production.json
          --token-env CHECKS_GITHUB_TOKEN --out checks-report.json
      - name: Deploy every descriptor component through the checked adapter
        if: ${{ always() }}
        run: >
          node infra/release/deploy-component.mjs
          --descriptor infra/release/targets/production.json
          --revision "$GITHUB_SHA" --checks-report checks-report.json
          --ledger infra/release/evidence/releases.jsonl
          --outcomes deploy-outcomes.json
      - name: Record the release attempt (append-only, digests only)
        if: ${{ always() }}
        run: >
          node infra/release/record-release-evidence.mjs
          --target production --descriptor infra/release/targets/production.json
          --revision "$GITHUB_SHA" --notes "$RELEASE_NOTES"
          --rehearsal-passed "$(jq -r .passed rehearsal-summary.json)"
          --rehearsal-rows "$(jq -r .rows rehearsal-summary.json)"
          --runtime-version a3.0 --client-version i7.1
          --migration-ledger rehearsal-ledger.jsonl
      - name: Upload the evidence ledger and outcomes (blocked runs fail while uploading evidence)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-production
          path: |
            infra/release/evidence/releases.jsonl
            deploy-outcomes.json
            checks-report.json
          if-no-files-found: error
