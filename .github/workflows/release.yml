name: Release

# The pinned release workflow (I7). Three rules this file exists to keep:
#
# 1. PRODUCTION IS EXPLICIT. The only trigger is workflow_dispatch with a
#    chosen target; checks (checks.yml) and a successful staging deploy can
#    never promote anything by themselves. The production job additionally
#    runs inside the protected `alpha-production` GitHub environment, so a
#    human approval gate stands between staging evidence and production.
# 2. SECRETS ARE ENVIRONMENT-SCOPED. The staging job may reference only
#    STAGING_* secrets and the production job only PRODUCTION_*; the
#    verify-release-target guard re-checks THIS file at deploy time and the
#    runtime environment label, so a smuggled cross-environment secret
#    fails the job before anything is touched.
# 3. NOTHING DEPLOYS WITHOUT THE REHEARSAL. The deterministic release
#    rehearsal (expand / interrupt / resume / mixed versions / contract)
#    must pass first; its ledger digest and row count land in the immutable
#    release evidence record.
#
# Provisioning honesty: the staging (kiero-staging-core) and alpha
# production (kiero-alpha-core) Convex projects are PENDING owner actions
# (infra/environments/*.md). Until they exist, the deploy steps stop at the
# guard and print the exact pending commands instead of pretending.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Release target (production requires the alpha-production environment approval)"
        type: choice
        options: [staging, production]
        required: true
      notes:
        description: "Why this release is being cut (printed next to the evidence record)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

# One release per target at a time: a concurrent attempt QUEUES (never
# cancels a running release), and a queued production run still stops at
# the protected-environment approval before doing anything.
concurrency:
  group: release-${{ github.event.inputs.target }}
  cancel-in-progress: false

jobs:
  rehearse:
    name: Deterministic release rehearsal (expand, interrupt, resume, contract)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KIERO_REHEARSAL_LEDGER: rehearsal-ledger.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - name: Clean install from the lockfile
        run: npm ci
      - name: Run the release rehearsal
        run: node --experimental-strip-types tools/migrations/rehearsal.mts
      - name: Unit checks of the release surfaces (migration, update flow, guards)
        run: npx vitest run tests/i7
      - name: Keep the rehearsal ledger and summary for the evidence records
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-evidence
          path: |
            rehearsal-ledger.jsonl
            rehearsal-summary.json
          if-no-files-found: error

  staging-deploy:
    name: Deploy synthetic staging (isolated environment)
    needs: rehearse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      KIERO_ENVIRONMENT: staging
      # Mapping through env: the secrets context cannot appear in step if:
      # conditions; the name is the ONLY thing this file hard-codes.
      STAGING_PROVISIONED: ${{ secrets.STAGING_CONVEX_DEPLOYMENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - name: Verify the release target (structure + label; names only, never values)
        run: node infra/release/verify-release-target.mjs --target staging --workflow .github/workflows/release.yml
      - name: Clean install from the lockfile
        run: npm ci
      - name: Download the rehearsal evidence
        uses: actions/download-artifact@v4
        with:
          name: rehearsal-evidence
      - name: Stop if synthetic staging is not provisioned yet (owner action)
        if: ${{ env.STAGING_PROVISIONED == '' }}
        run: |
          echo "STAGING PENDING PROVISIONING: the Convex project kiero-staging-core does not exist yet."
          echo "Exact owner commands are recorded in infra/environments/synthetic-staging.md."
          echo "This job stays green so the workflow's guard rails remain exercised; no deploy happened."
      - name: Deploy the web build to the staging host
        if: ${{ env.STAGING_PROVISIONED != '' }}
        run: echo "staging web deploy lands with the provisioning owner action (guarded above)"
      - name: Record the release evidence (append-only, digests only)
        run: |
          node infra/release/record-release-evidence.mjs \
            --target staging \
            --revision "$GITHUB_SHA" \
            --rehearsal-passed "$(jq -r .passed rehearsal-summary.json)" \
            --rehearsal-rows "$(jq -r .rows rehearsal-summary.json)" \
            --runtime-version a3.0 \
            --client-version i7.1 \
            --migration-ledger rehearsal-ledger.jsonl
      - name: Upload the appended evidence ledger for curation
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-staging
          path: infra/release/evidence/releases.jsonl
          if-no-files-found: error

  production-deploy:
    name: Deploy alpha production (explicit trigger + protected environment)
    needs: [rehearse, staging-deploy]
    if: ${{ github.event.inputs.target == 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: alpha-production
    env:
      KIERO_ENVIRONMENT: production
      PRODUCTION_PROVISIONED: ${{ secrets.PRODUCTION_CONVEX_DEPLOYMENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - name: Verify the release target (structure + label; names only, never values)
        run: node infra/release/verify-release-target.mjs --target production --workflow .github/workflows/release.yml
      - name: Clean install from the lockfile
        run: npm ci
      - name: Download the rehearsal evidence
        uses: actions/download-artifact@v4
        with:
          name: rehearsal-evidence
      - name: Stop if alpha production is not provisioned yet (owner action)
        if: ${{ env.PRODUCTION_PROVISIONED == '' }}
        run: |
          echo "PRODUCTION PENDING PROVISIONING: the Convex project kiero-alpha-core does not exist yet."
          echo "Exact owner commands are recorded in infra/environments/alpha-production.md."
          echo "No deploy happened; the explicit trigger and protected environment are wired."
      - name: Deploy the web build to the production host
        if: ${{ env.PRODUCTION_PROVISIONED != '' }}
        run: echo "production web deploy lands with the provisioning owner action (guarded above)"
      - name: Record the release evidence (append-only, digests only)
        run: |
          node infra/release/record-release-evidence.mjs \
            --target production \
            --revision "$GITHUB_SHA" \
            --rehearsal-passed "$(jq -r .passed rehearsal-summary.json)" \
            --rehearsal-rows "$(jq -r .rows rehearsal-summary.json)" \
            --runtime-version a3.0 \
            --client-version i7.1 \
            --migration-ledger rehearsal-ledger.jsonl
      - name: Upload the appended evidence ledger for curation
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-production
          path: infra/release/evidence/releases.jsonl
          if-no-files-found: error
