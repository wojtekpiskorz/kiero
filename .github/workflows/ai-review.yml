name: AI review

# advisory only: findings are comments and never gate the merge;
# the deterministic gates (biome, tsc, vitest, e2e) live in ci.yml
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

# rapid pushes supersede their review runs; cancel so quota follows the latest sha
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: advisory review (GLM · thermo-nuclear + unslop)
    # drafts fire opened/synchronize too; skip them so WIP pushes don't burn
    # coding-plan quota (ready_for_review re-triggers once the PR goes live).
    # Fork PRs skip too: GitHub withholds secrets and write perms from them,
    # so a run there can only fail red and read like a broken gate.
    # (The changesets-generated Version Packages PR skip died with the
    # retirement gate, #215 — Changesets is gone, so no such PR can exist.)
    if: >-
      ${{ !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Z.AI GLM coding plan through its Anthropic-compatible endpoint (wayfinder #42)
      ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_API_KEY }}
      # the endpoint serves only these two IDs; map every model class the CLI may request
      ANTHROPIC_DEFAULT_OPUS_MODEL: glm-5.3
      ANTHROPIC_DEFAULT_SONNET_MODEL: glm-5.3
      ANTHROPIC_DEFAULT_HAIKU_MODEL: glm-5.3-flash
      API_TIMEOUT_MS: "3000000" # Z.AI-recommended long-turn timeout; the job clock is the real bound
      # reasoning at max (GLM levels low/high/max). The endpoint defaults to
      # max; this env overrides any lower effort the CLI sends explicitly.
      CLAUDE_CODE_EFFORT_LEVEL: max
    steps:
      # full history: the crap4ts recompute diffs the PR scope against the base sha
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # pin npm to packageManager (keep in sync) — same lockfile/validation
      # skew rationale as ci.yml (#211)
      - run: npm install -g npm@11.6.2
      # recompute the CRAP table from scratch. CI is the source of truth,
      # local runs are advisory (wayfinder #55)
      - run: npm ci
      # the fixture install must precede crap:ci: the coverage run executes
      # the root vitest config, whose real-dev-server legs build the canonical
      # fixture (e2e/fixture has its own committed lockfile) — without it the
      # coverage run fails and the risk table degrades to CC-only (#346)
      - run: npm ci
        working-directory: e2e/fixture
      - run: npm run crap:ci
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      # SHA-pinned v1: the one action here that holds a PR-write token and a
      # paid API key, so tag movement must not swap code under it silently
      - uses: anthropics/claude-code-action@62529b7c89dbb8cfaa838f2c87f2f8459b46fe68 # v1
        with:
          # the input satisfies the action's env validation; the env pair above
          # is what actually routes the CLI to Z.AI with Bearer auth
          anthropic_api_key: ${{ secrets.ZAI_API_KEY }}
          # the workflow's own token: skips the official Claude GitHub App
          # exchange (401 when that app isn't installed, and its default-branch
          # workflow check would skip the first run on PRs touching workflows);
          # comments post as github-actions[bot]
          github_token: ${{ github.token }}
          # advisory only: fixes happen in the local review loop, never from CI
          include_fix_links: false
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the advisory AI reviewer for this repository. The deterministic gates (biome, tsc, vitest, playwright e2e) already run in CI: do not re-report what they catch. You are the judgment layer.

            Read these files from the checked-out working directory first and conduct the review exactly as they direct:
            - .agents/skills/thermo-nuclear-code-quality-review/SKILL.md: the review standard (abstraction quality, spaghetti growth, code-judo simplification). Its Output Expectations and Approval Bar govern your findings.
            - .agents/skills/unslop/SKILL.md: apply to every piece of prose you read and write, your own comments, and any prose the PR adds (docs, comments, titles).
            - AGENTS.md: house rules the diff must respect, meaning code style, testing doctrine, boundaries (Always / Ask first / Never), gotchas.
            - CONTEXT.md: the glossary; flag drift from its terms.
            - crap-table.md (workspace root): the crap4ts risk table this CI recomputed for the PR — CC per function (ESLint-classic counting), CRAP where per-function coverage is real (src/core + packages/core), Uncle-Bob bands, PR-touched functions marked, stop breaches and baseline-grandfathered debt listed. Weigh it when judging the diff: call out PR-touched functions landing high-band or breaching the preflight stops (CRAP >= 30 in src/core or packages/core, CC >= 15 elsewhere). Grandfathered entries are known calibrated debt — raise them only if the PR makes them worse.

            The PR branch is already checked out in the current working directory. Inspect it with `gh pr diff`, `gh pr view`, and by reading files; judge the diff in the context of the surrounding code, not in isolation.

            Rounds are stateless: each run starts fresh, so recover your context from the PR thread before judging anything — `gh pr view <PR NUMBER> --comments`. When earlier rounds exist, your previous advisory summary is the last github-actions[bot] comment there (the one you will edit in place), and author replies and owner rulings sit in the same thread. Treat that thread as your memory of earlier rounds: findings whose fixes have landed are resolved — verify where the fix actually lives (the current diff, the branch, or `origin/main`; fixes can land out-of-band), then drop, never re-report; findings explicitly rejected or overruled on the thread stay closed. Review the full diff every round regardless: the thread narrows what you report, not what you inspect.

            This review is advisory: you must not modify anything, and no finding blocks CI. The author applies feedback locally.

            The action posts nothing on its own in this automation mode, so deliver the review yourself, as the final action of the session (a run canceled by a newer push then posts nothing): write the summary (thermo-nuclear priority order, high-conviction findings only; if nothing is worth raising, say that briefly instead of inventing nits) and post it with `gh pr comment <PR NUMBER> --edit-last --create-if-none --body-file -` (stdin). One advisory summary comment per PR, edited in place across pushes. Highlight specific lines with `mcp__github_inline_comment__create_inline_comment` (confirmed: true). Only post GitHub comments; do not submit review text as messages.
          claude_args: |
            --model glm-5.3
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
