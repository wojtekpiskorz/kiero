name: Checks

# Deterministic gates for the pinned workspace (A1). This mirrors the
# documented local procedure: clean install from the lockfile, strict
# typecheck, the bootstrap smoke test and a web build, all on one pinned
# Node version (22.22.3, matching the engines field). The advisory AI
# review stays in ai-review.yml and never gates a merge; no secrets are
# used here.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: npm ci, typecheck, test, build (Node 22.22.3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - name: Clean install from the lockfile
        run: npm ci
      - name: Strict typecheck (root and every workspace)
        run: npm run typecheck
      - name: Test suite (contracts, values, platform runtime)
        run: npm run test
      - name: Convex generated output present and unhand-edited (A3 policy)
        run: |
          set -eu
          for f in api.d.ts api.js dataModel.d.ts server.d.ts server.js; do
            test -f "convex/_generated/$f" || { echo "missing convex/_generated/$f"; exit 1; }
            git ls-files --error-unmatch "convex/_generated/$f" >/dev/null || { echo "convex/_generated/$f is not committed"; exit 1; }
          done
          grep -q "THIS CODE IS AUTOMATICALLY GENERATED" convex/_generated/api.d.ts
          grep -q "THIS CODE IS AUTOMATICALLY GENERATED" convex/_generated/server.d.ts
          # Full regeneration needs an authenticated deployment (convex 1.45 CLI),
          # so CI checks presence/integrity; the coordinating writer regenerates
          # via `npm run convex:codegen` before every merge to main.
      - name: Environment descriptors shape check (I1, wired by A3)
        run: npm run verify:environments
      - name: Evaluation corpus and scoring probe (E1, wired by A3)
        run: npm run verify:corpus
      - name: Build the web app
        run: npm run build
