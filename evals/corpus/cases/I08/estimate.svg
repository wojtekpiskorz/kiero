<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
<desc>Wydruk listy materiałów z nagłówkiem SZACUNEK: klej 320 zł, grunty 140 zł, silikony 90 zł, płytki 3 650 zł, razem ~ 4 200 zł.</desc>
<rect width="800" height="600" fill="#ffffff"/>
<text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#111" font-weight="bold">SZACUNEK — MATERIAŁY</text>
<line x1="60" y1="100" x2="740" y2="100" stroke="#111" stroke-width="2"/>
<text x="60" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111" font-weight="normal">klej</text>
<text x="640" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111" font-weight="normal" text-anchor="end">320 zł</text>
<text x="60" y="190" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111" font-weight="normal">grunty</text>
<text x="640" y="190" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111" font-weight="normal" text-anchor="end">140 zł</text>
<text x="60" y="230" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111" font-weight="normal">silikony</text>
<text x="640" y="230" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111" font-weight="normal" text-anchor="end">90 zł</text>
<text x="60" y="270" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111" font-weight="normal">płytki</text>
<text x="640" y="270" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111" font-weight="normal" text-anchor="end">3 650 zł</text>
<line x1="60" y1="330" x2="740" y2="330" stroke="#111" stroke-width="1"/>
<text x="560" y="380" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111" font-weight="bold" text-anchor="end">razem ~ 4 200</text>
</svg>
