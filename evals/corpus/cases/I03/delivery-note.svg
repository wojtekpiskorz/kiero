<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
<desc>Wydruk dostawy: Płytki gres 45 m², netto 6 300,00 zł, VAT 23% 1 449,00 zł, razem brutto 7 749,00 zł.</desc>
<rect width="600" height="800" fill="#ffffff"/>
<text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#111" font-weight="bold" letter-spacing="1">DOSTAWA nr 118/2026</text>
<text x="60" y="112" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#111" font-weight="normal">Ceramica Synth sp. z o.o. (dane syntetyczne)</text>
<line x1="60" y1="140" x2="540" y2="140" stroke="#111" stroke-width="2"/>
<text x="60" y="190" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111" font-weight="bold">Pozycja</text>
<text x="360" y="190" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111" font-weight="bold">Ilość</text>
<text x="460" y="190" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111" font-weight="bold">Wartość</text>
<line x1="60" y1="205" x2="540" y2="205" stroke="#999" stroke-width="1"/>
<text x="60" y="240" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111" font-weight="normal">Płytki gres</text>
<text x="360" y="240" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111" font-weight="normal">45 m²</text>
<text x="460" y="240" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111" font-weight="normal">6 300,00 zł</text>
<line x1="60" y1="265" x2="540" y2="265" stroke="#999" stroke-width="1"/>
<text x="360" y="310" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111" font-weight="normal" text-anchor="end">netto:</text>
<text x="460" y="310" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111" font-weight="bold">6 300,00 zł</text>
<text x="360" y="340" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111" font-weight="normal" text-anchor="end">VAT 23%:</text>
<text x="460" y="340" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111" font-weight="normal">1 449,00 zł</text>
<text x="360" y="380" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111" font-weight="bold" text-anchor="end">brutto:</text>
<text x="460" y="380" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#111" font-weight="bold">7 749,00 zł</text>
