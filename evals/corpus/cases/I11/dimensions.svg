<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
<desc>Rysunek techniczny z trzema wymiarami: 1200 mm, 80 cm, 3,5 m — jednostki oryginalne, bez przeliczeń.</desc>
<rect width="800" height="600" fill="#ffffff"/>
<rect x="120" y="160" width="520" height="280" fill="none" stroke="#111" stroke-width="2"/>
<line x1="120" y1="120" x2="640" y2="120" stroke="#111" stroke-width="1"/>
<line x1="120" y1="110" x2="120" y2="130" stroke="#111" stroke-width="1"/>
<line x1="640" y1="110" x2="640" y2="130" stroke="#111" stroke-width="1"/>
<text x="310" y="105" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111" font-weight="normal" text-anchor="middle">1200 mm</text>
<line x1="680" y1="160" x2="680" y2="440" stroke="#111" stroke-width="1"/>
<line x1="670" y1="160" x2="690" y2="160" stroke="#111" stroke-width="1"/>
<line x1="670" y1="440" x2="690" y2="440" stroke="#111" stroke-width="1"/>
<text x="712" y="310" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111" font-weight="normal">80 cm</text>
<line x1="240" y1="500" x2="520" y2="500" stroke="#111" stroke-width="1"/>
<text x="340" y="540" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#111" font-weight="normal">3,5 m</text>
</svg>
